---
# tasks file for traefik

- name: Create Traefik application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0775'
  loop:
    - "/home/{{ service_user_name }}/traefik"
    - "/home/{{ service_user_name }}/traefik/config"
    - "/home/{{ service_user_name }}/traefik/config/dynamic"
    - "/home/{{ service_user_name }}/traefik/certs"
    - "/home/{{ service_user_name }}/traefik/logs"
    - "/home/{{ service_user_name }}/.config"
    - "/home/{{ service_user_name }}/.config/systemd"
    - "/home/{{ service_user_name }}/.config/systemd/user"

- name: Get service user UID
  ansible.builtin.command:
    cmd: "id -u {{ service_user_name }}"
  register: traefik_service_uid
  changed_when: false

- name: Check if OpenBao AppRole credentials exist for Traefik certificate auto-renewal
  ansible.builtin.stat:
    path: "/home/{{ service_user_name }}/traefik/.openbao_approle"
  register: traefik_openbao_approle_stat

- name: Deploy Traefik automated certificate renewal script (renew-cert.sh)
  ansible.builtin.template:
    src: renew-cert.sh.j2
    dest: "/home/{{ service_user_name }}/traefik/renew-cert.sh"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0750'
  when: traefik_openbao_approle_stat.stat.exists

- name: Execute certificate renewal script to ensure valid certificate is present
  ansible.builtin.command:
    cmd: "/home/{{ service_user_name }}/traefik/renew-cert.sh"
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ traefik_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_service_uid.stdout }}/bus"
  register: initial_cert_renew_exec
  changed_when: "'SUCCESS: Certificate and private key renewed successfully' in initial_cert_renew_exec.stdout"
  when: traefik_openbao_approle_stat.stat.exists

- name: Deploy Traefik certificate renewer systemd user service unit
  ansible.builtin.template:
    src: traefik-cert-renewer.service.j2
    dest: "/home/{{ service_user_name }}/.config/systemd/user/traefik-cert-renewer.service"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  when: traefik_openbao_approle_stat.stat.exists

- name: Deploy Traefik certificate renewer systemd user timer unit
  ansible.builtin.template:
    src: traefik-cert-renewer.timer.j2
    dest: "/home/{{ service_user_name }}/.config/systemd/user/traefik-cert-renewer.timer"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  when: traefik_openbao_approle_stat.stat.exists

- name: Check if existing TLS certificate exists
  ansible.builtin.stat:
    path: "/home/{{ service_user_name }}/traefik/certs/tls.crt"
  register: traefik_cert_stat

- name: Check if existing TLS certificate is ECDSA and matches configured domains
  ansible.builtin.command:
    cmd: "openssl x509 -in /home/{{ service_user_name }}/traefik/certs/tls.crt -noout -text"
  register: existing_cert_info
  changed_when: false
  failed_when: false
  when: traefik_cert_stat.stat.exists

- name: Check existing TLS certificate Subject Alternative Names (SAN)
  ansible.builtin.command:
    cmd: "openssl x509 -in /home/{{ service_user_name }}/traefik/certs/tls.crt -noout -ext subjectAltName"
  register: existing_cert_san
  changed_when: false
  failed_when: false
  when: traefik_cert_stat.stat.exists

- name: Generate self-signed ECDSA (P-384) TLS certificate fallback (when OpenBao PKI is not used)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:secp384r1 -nodes
      -days {{ traefik_selfsigned_fallback_days | default(10950) }}
      -keyout /home/{{ service_user_name }}/traefik/certs/tls.key
      -out /home/{{ service_user_name }}/traefik/certs/tls.crt

      -subj "/CN={{ traefik_forgejo_domain }}/O=Homelab/OU=Infrastructure"
      -addext "subjectAltName=DNS:{{ traefik_forgejo_domain }},DNS:{{ traefik_openbao_domain }},DNS:localhost,IP:127.0.0.1{% if ansible_host | regex_search('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$') %},IP:{{ ansible_host }}{% endif %}"
  become: true
  become_user: "{{ service_user_name }}"
  notify: Restart Traefik service
  when: >
    (not traefik_openbao_approle_stat.stat.exists) and (
      (not traefik_cert_stat.stat.exists) or
      (existing_cert_info.stdout is defined and 'id-ecPublicKey' not in existing_cert_info.stdout) or
      (existing_cert_san.stdout is defined and ('DNS:' + traefik_forgejo_domain) not in existing_cert_san.stdout) or
      (existing_cert_san.stdout is defined and ('DNS:' + traefik_openbao_domain) not in existing_cert_san.stdout)
    )

- name: Ensure correct permissions on TLS certificate and private key
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "/home/{{ service_user_name }}/traefik/certs/tls.key", mode: '0600' }
    - { path: "/home/{{ service_user_name }}/traefik/certs/tls.crt", mode: '0644' }

- name: Deploy Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "/home/{{ service_user_name }}/traefik/config/traefik.yml"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  notify: Restart Traefik service

- name: Deploy Traefik dynamic configuration (Routers, Services, TLS)
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "/home/{{ service_user_name }}/traefik/config/dynamic/dynamic.yml"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  notify: Restart Traefik service

- name: Deploy Traefik docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/home/{{ service_user_name }}/traefik/docker-compose.yml"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0640'
  notify: Restart Traefik service

- name: Deploy Traefik systemd user service unit
  ansible.builtin.template:
    src: traefik.service.j2
    dest: "/home/{{ service_user_name }}/.config/systemd/user/traefik.service"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  notify: Restart Traefik service

- name: Reload systemd user daemon for service user
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ traefik_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_service_uid.stdout }}/bus"


- name: Enable and start Traefik certificate renewer timer for service user
  ansible.builtin.systemd_service:
    name: traefik-cert-renewer.timer
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ traefik_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_service_uid.stdout }}/bus"
  when: traefik_openbao_approle_stat.stat.exists

- name: Enable and start Traefik service for service user
  ansible.builtin.systemd_service:
    name: traefik.service
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ traefik_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_service_uid.stdout }}/bus"

- name: Flush handlers to restart Traefik if configuration changed
  ansible.builtin.meta: flush_handlers
