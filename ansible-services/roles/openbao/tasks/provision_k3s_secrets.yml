---
# tasks file for OpenBao K3s secrets pre-provisioning (KV v2 engine on secret/)

- name: Retrieve existing K3s secrets from OpenBao KV v2 storage
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openbao_port }}/v1/secret/data/{{ item.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ effective_root_token }}"
    status_code: [200, 404]
  loop: "{{ openbao_k3s_secrets | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: openbao_existing_k3s_secrets
  when:
    - openbao_provision_k3s_secrets | default(true) | bool
    - effective_root_token | default('') | length > 0

- name: Resolve effective K3s secrets payloads and detect changes
  ansible.builtin.set_fact:
    openbao_resolved_k3s_secrets: >-
      {% set resolved = [] %}
      {% for item in (openbao_k3s_secrets | default([])) | zip(openbao_existing_k3s_secrets.results | default([])) %}
        {% set secret_data = {} %}
        {% set existing = (item.1.json.data.data if (item.1.status == 200 and 'json' in item.1 and 'data' in item.1.json and 'data' in item.1.json.data) else {}) %}
        {% for k, v in item.0.data.items() %}
          {% if v is not none and (v | string | length) > 0 %}
            {% set _ = secret_data.update({k: (v | string)}) %}
          {% elif k in existing and (existing[k] | string | length) > 0 %}
            {% set _ = secret_data.update({k: (existing[k] | string)}) %}
          {% elif item.0.digits_only_keys is defined and k in item.0.digits_only_keys %}
            {% set d_len = (item.0.digits_only_keys[k] if item.0.digits_only_keys is mapping else 18) %}
            {% set _ = secret_data.update({k: lookup('password', '/dev/null length=' ~ (d_len | string) ~ ' chars=digits')}) %}
          {% else %}
            {% set _ = secret_data.update({k: lookup('password', '/dev/null length=24 chars=ascii_letters,digits')}) %}
          {% endif %}
        {% endfor %}
        {% set _ = resolved.append({
          'path': item.0.path,
          'secret_data': secret_data,
          'needs_update': (secret_data != existing)
        }) %}
      {% endfor %}
      {{ resolved | to_json }}
  when:
    - openbao_provision_k3s_secrets | default(true) | bool
    - effective_root_token | default('') | length > 0
    - openbao_existing_k3s_secrets.results is defined

- name: Provision changed K3s secrets into OpenBao KV v2 storage
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openbao_port }}/v1/secret/data/{{ item.path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ effective_root_token }}"
    body_format: json
    body:
      data: "{{ item.secret_data }}"
    status_code: [200, 204]
  loop: "{{ (openbao_resolved_k3s_secrets | default('[]')) | from_json }}"
  loop_control:
    label: "{{ item.path }} (needs_update: {{ item.needs_update }})"
  when:
    - openbao_provision_k3s_secrets | default(true) | bool
    - effective_root_token | default('') | length > 0
    - item.needs_update | bool
