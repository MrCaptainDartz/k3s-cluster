---
# tasks file for podman role

- name: Install Podman and rootless container dependencies
  ansible.builtin.apt:
    name:
      - podman
      - podman-docker
      - podman-compose
      - docker-compose-v2
      - uidmap
      - slirp4netns
      - fuse-overlayfs
      - dbus-user-session
      - curl
      - ca-certificates
    state: present
    update_cache: true

- name: Silence Docker emulation banner
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    mode: '0644'
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve

- name: Create systemd user service drop-in directory for cgroup delegation
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure cgroup v2 controller delegation for user sessions
  ansible.builtin.template:
    src: delegate.conf.j2
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Flush handlers to ensure systemd is reloaded
  ansible.builtin.meta: flush_handlers

- name: Get service user UID
  ansible.builtin.command:
    cmd: "id -u {{ service_user_name }}"
  register: service_user_uid_result
  changed_when: false

- name: Ensure user runtime directory exists
  ansible.builtin.file:
    path: "/run/user/{{ service_user_uid_result.stdout }}"
    state: directory
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0700'

- name: Enable and start rootless Podman socket for service user
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ service_user_uid_result.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_user_uid_result.stdout }}/bus"

- name: Create shared rootless Podman network for infra services
  ansible.builtin.command:
    cmd: "podman network create services-network"
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ service_user_uid_result.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ service_user_uid_result.stdout }}/bus"
  register: create_network_res
  changed_when: create_network_res.rc == 0
  failed_when: create_network_res.rc != 0 and 'already exists' not in create_network_res.stderr
