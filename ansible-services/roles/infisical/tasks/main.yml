---
# tasks file for infisical

- name: Create Infisical application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: "{{ item.mode | default('0775') }}"
  loop:
    - { path: "{{ infisical_dir }}" }
    - { path: "{{ infisical_dir }}/data" }
    - { path: "{{ infisical_dir }}/data/postgres", mode: '0777' }
    - { path: "{{ infisical_dir }}/data/redis", mode: '0777' }
    - { path: "/home/{{ service_user_name }}/.config" }
    - { path: "/home/{{ service_user_name }}/.config/systemd" }
    - { path: "/home/{{ service_user_name }}/.config/systemd/user" }

- name: Check if existing Infisical .env file exists
  ansible.builtin.stat:
    path: "{{ infisical_dir }}/.env"
  register: infisical_env_stat

- name: Read existing ENCRYPTION_KEY if .env exists
  ansible.builtin.command:
    cmd: "grep '^ENCRYPTION_KEY=' {{ infisical_dir }}/.env"
  register: existing_encryption_key_raw
  changed_when: false
  failed_when: false
  when: infisical_env_stat.stat.exists

- name: Read existing AUTH_SECRET if .env exists
  ansible.builtin.command:
    cmd: "grep '^AUTH_SECRET=' {{ infisical_dir }}/.env"
  register: existing_auth_secret_raw
  changed_when: false
  failed_when: false
  when: infisical_env_stat.stat.exists

- name: Read existing POSTGRES_PASSWORD if Infisical .env exists
  ansible.builtin.command:
    cmd: "grep '^POSTGRES_PASSWORD=' {{ infisical_dir }}/.env"
  register: existing_infisical_db_password_raw
  changed_when: false
  failed_when: false
  when: infisical_env_stat.stat.exists

- name: Read existing REDIS_PASSWORD if Infisical .env exists
  ansible.builtin.command:
    cmd: "grep '^REDIS_PASSWORD=' {{ infisical_dir }}/.env"
  register: existing_infisical_redis_password_raw
  changed_when: false
  failed_when: false
  when: infisical_env_stat.stat.exists

- name: Generate random 16-byte hex encryption key (32 hex chars) if not set
  ansible.builtin.command:
    cmd: "openssl rand -hex 16"
  register: generated_encryption_key
  changed_when: false
  when:
    - (infisical_encryption_key | default('')) | length == 0
    - not (infisical_env_stat.stat.exists and (existing_encryption_key_raw.stdout | length > 0))

- name: Generate random base64 auth secret if not set
  ansible.builtin.command:
    cmd: "openssl rand -base64 32"
  register: generated_auth_secret
  changed_when: false
  when:
    - (infisical_auth_secret | default('')) | length == 0
    - not (infisical_env_stat.stat.exists and (existing_auth_secret_raw.stdout | length > 0))

- name: Generate random database password if not set
  ansible.builtin.command:
    cmd: "openssl rand -hex 24"
  register: generated_infisical_db_password
  changed_when: false
  when:
    - (infisical_db_password | default('')) | length == 0
    - not (infisical_env_stat.stat.exists and (existing_infisical_db_password_raw.stdout | length > 0))

- name: Generate random Redis password if not set
  ansible.builtin.command:
    cmd: "openssl rand -hex 24"
  register: generated_infisical_redis_password
  changed_when: false
  when:
    - (infisical_redis_password | default('')) | length == 0
    - not (infisical_env_stat.stat.exists and (existing_infisical_redis_password_raw.stdout | length > 0))

- name: Resolve effective encryption key, auth secret and database password
  ansible.builtin.set_fact:
    resolved_infisical_encryption_key: >-
      {{
        infisical_encryption_key
        if (infisical_encryption_key | default('')) | length > 0
        else (
          (existing_encryption_key_raw.stdout | regex_replace('^ENCRYPTION_KEY=', ''))
          if (infisical_env_stat.stat.exists and (existing_encryption_key_raw.stdout | default('')) | length > 0)
          else generated_encryption_key.stdout
        )
      }}
    resolved_infisical_auth_secret: >-
      {{
        infisical_auth_secret
        if (infisical_auth_secret | default('')) | length > 0
        else (
          (existing_auth_secret_raw.stdout | regex_replace('^AUTH_SECRET=', ''))
          if (infisical_env_stat.stat.exists and (existing_auth_secret_raw.stdout | default('')) | length > 0)
          else generated_auth_secret.stdout
        )
      }}
    resolved_infisical_db_password: >-
      {{
        infisical_db_password
        if (infisical_db_password | default('')) | length > 0
        else (
          (existing_infisical_db_password_raw.stdout | regex_replace('^POSTGRES_PASSWORD=', ''))
          if (infisical_env_stat.stat.exists and (existing_infisical_db_password_raw.stdout | default('')) | length > 0)
          else generated_infisical_db_password.stdout
        )
      }}
    resolved_infisical_redis_password: >-
      {{
        infisical_redis_password
        if (infisical_redis_password | default('')) | length > 0
        else (
          (existing_infisical_redis_password_raw.stdout | regex_replace('^REDIS_PASSWORD=', ''))
          if (infisical_env_stat.stat.exists and (existing_infisical_redis_password_raw.stdout | default('')) | length > 0)
          else generated_infisical_redis_password.stdout
        )
      }}

- name: Deploy Infisical .env configuration
  ansible.builtin.template:
    src: infisical.env.j2
    dest: "{{ infisical_dir }}/.env"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0600'
  notify: Restart Infisical service

- name: Deploy Infisical docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ infisical_dir }}/docker-compose.yml"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0640'
  notify: Restart Infisical service

- name: Deploy Infisical systemd user service unit
  ansible.builtin.template:
    src: infisical.service.j2
    dest: "/home/{{ service_user_name }}/.config/systemd/user/infisical.service"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  notify: Restart Infisical service

- name: Get service user UID
  ansible.builtin.command:
    cmd: "id -u {{ service_user_name }}"
  register: infisical_service_uid
  changed_when: false

- name: Reload systemd user daemon for service user
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ infisical_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ infisical_service_uid.stdout }}/bus"

- name: Enable and start Infisical service for service user
  ansible.builtin.systemd_service:
    name: infisical.service
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ infisical_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ infisical_service_uid.stdout }}/bus"

- name: Flush handlers to restart Infisical if configuration changed
  ansible.builtin.meta: flush_handlers

- name: Wait for Infisical Backend service to be healthy and responsive
  ansible.builtin.command:
    cmd: "podman exec infisical-backend curl -f http://localhost:8080/api/status"
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ infisical_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ infisical_service_uid.stdout }}/bus"
  register: infisical_api_status
  until: infisical_api_status.rc == 0
  retries: 30
  delay: 3
  changed_when: false
