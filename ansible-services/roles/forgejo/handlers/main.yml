---
# handlers file for forgejo

- name: Restart Forgejo service
  ansible.builtin.systemd_service:
    name: forgejo.service
    scope: user
    state: restarted
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"
