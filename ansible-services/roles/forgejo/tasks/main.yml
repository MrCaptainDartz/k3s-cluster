---
# tasks file for forgejo

- name: Create Forgejo application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0775'
  loop:
    - "{{ forgejo_dir }}"
    - "{{ forgejo_dir }}/data"
    - "{{ forgejo_dir }}/data/postgres"
    - "{{ forgejo_dir }}/data/forgejo"
    - "/home/{{ service_user_name }}/.config"
    - "/home/{{ service_user_name }}/.config/systemd"
    - "/home/{{ service_user_name }}/.config/systemd/user"

- name: Check if existing Forgejo .env file exists
  ansible.builtin.stat:
    path: "{{ forgejo_dir }}/.env"
  register: forgejo_env_stat

- name: Read existing POSTGRES_PASSWORD if Forgejo .env exists
  ansible.builtin.command:
    cmd: "grep '^POSTGRES_PASSWORD=' {{ forgejo_dir }}/.env"
  register: existing_forgejo_db_password_raw
  changed_when: false
  failed_when: false
  when: forgejo_env_stat.stat.exists

- name: Generate random database password if not set
  ansible.builtin.command:
    cmd: "openssl rand -hex 24"
  register: generated_forgejo_db_password
  changed_when: false
  when:
    - (forgejo_db_password | default('')) | length == 0
    - not (forgejo_env_stat.stat.exists and (existing_forgejo_db_password_raw.stdout | length > 0))

- name: Resolve effective Forgejo database password
  ansible.builtin.set_fact:
    resolved_forgejo_db_password: >-
      {{
        forgejo_db_password
        if (forgejo_db_password | default('')) | length > 0
        else (
          (existing_forgejo_db_password_raw.stdout | regex_replace('^POSTGRES_PASSWORD=', ''))
          if (forgejo_env_stat.stat.exists and (existing_forgejo_db_password_raw.stdout | default('')) | length > 0)
          else generated_forgejo_db_password.stdout
        )
      }}

- name: Deploy Forgejo .env configuration
  ansible.builtin.template:
    src: forgejo.env.j2
    dest: "{{ forgejo_dir }}/.env"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0600'
  notify: Restart Forgejo service

- name: Deploy Forgejo docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_dir }}/docker-compose.yml"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0640'
  notify: Restart Forgejo service

- name: Deploy Forgejo systemd user service unit
  ansible.builtin.template:
    src: forgejo.service.j2
    dest: "/home/{{ service_user_name }}/.config/systemd/user/forgejo.service"
    owner: "{{ service_user_name }}"
    group: "{{ service_user_name }}"
    mode: '0644'
  notify: Restart Forgejo service

- name: Get service user UID
  ansible.builtin.command:
    cmd: "id -u {{ service_user_name }}"
  register: forgejo_service_uid
  changed_when: false

- name: Reload systemd user daemon for service user
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"

- name: Enable and start Forgejo service for service user
  ansible.builtin.systemd_service:
    name: forgejo.service
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"

- name: Flush handlers to restart Forgejo if configuration changed
  ansible.builtin.meta: flush_handlers

# ------------------------------------------------------------
# Forgejo Initial Administrator Auto-Creation
# ------------------------------------------------------------
- name: Wait for Forgejo service to be responsive
  ansible.builtin.command:
    cmd: "podman exec --user git forgejo forgejo admin user list"
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"
  register: forgejo_ready_check
  until: forgejo_ready_check.rc == 0
  retries: 25
  delay: 3
  changed_when: false
  when: forgejo_admin_create | default(true)

- name: Check existing Forgejo users
  ansible.builtin.command:
    cmd: "podman exec --user git forgejo forgejo admin user list --admin"
  register: existing_forgejo_users
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"
  changed_when: false
  failed_when: false
  when: forgejo_admin_create | default(true)

- name: Generate random Forgejo admin password if not provided
  ansible.builtin.command:
    cmd: "openssl rand -base64 24"
  register: generated_forgejo_admin_password
  changed_when: false
  when:
    - forgejo_admin_create | default(true)
    - forgejo_admin_username not in (existing_forgejo_users.stdout | default(''))
    - (forgejo_admin_password | default('')) | length == 0

- name: Resolve effective Forgejo admin password
  ansible.builtin.set_fact:
    resolved_forgejo_admin_password: >-
      {{
        forgejo_admin_password
        if (forgejo_admin_password | default('')) | length > 0
        else generated_forgejo_admin_password.stdout
      }}
  when:
    - forgejo_admin_create | default(true)
    - forgejo_admin_username not in (existing_forgejo_users.stdout | default(''))

- name: Create initial Forgejo admin user
  ansible.builtin.command:
    cmd: >-
      podman exec --user git forgejo forgejo admin user create
      --admin
      --username "{{ forgejo_admin_username }}"
      --email "{{ forgejo_admin_email }}"
      --password "{{ resolved_forgejo_admin_password }}"
  become: true
  become_user: "{{ service_user_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ forgejo_service_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ forgejo_service_uid.stdout }}/bus"
  register: create_forgejo_admin_res
  when:
    - forgejo_admin_create | default(true)
    - forgejo_admin_username not in (existing_forgejo_users.stdout | default(''))

- name: Ensure local output directory exists on Ansible controller
  ansible.builtin.file:
    path: "{{ playbook_dir }}/output"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when:
    - forgejo_admin_create | default(true)
    - create_forgejo_admin_res is changed

- name: Save Forgejo credentials to local output file
  ansible.builtin.copy:
    dest: "{{ playbook_dir }}/output/forgejo-credentials.txt"
    mode: '0600'
    content: |
      ============================================================
      Forgejo Administrator Credentials
      Generated on : {{ ansible_date_time.iso8601 }}
      ============================================================
      URL      : https://{{ traefik_forgejo_domain | default(ansible_host) }}
      Username : {{ forgejo_admin_username }}
      Email    : {{ forgejo_admin_email }}
      Password : {{ resolved_forgejo_admin_password }}
      ============================================================
  delegate_to: localhost
  become: false
  when:
    - forgejo_admin_create | default(true)
    - create_forgejo_admin_res is changed
