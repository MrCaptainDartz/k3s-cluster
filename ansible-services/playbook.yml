---
- name: Provision and configure Dedicated Infrastructure Services VM (Forgejo + OpenBao)
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for cloud-init to complete initial setup
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        state: present
        timeout: 600

  roles:
    - system_timezone
    - essential_packages
    - security_hardening
    - firewall
    - service_user
    - podman
    - role: forgejo
      when: forgejo_enabled | default(true)
    - role: openbao
      when: openbao_enabled | default(true)
    - role: traefik
      when: traefik_enabled | default(true)
    - role: node_exporter
      when: node_exporter_enabled | default(true)
      tags: [node_exporter]
    - role: alloy
      when: alloy_enabled | default(true)
      tags: [alloy]


  post_tasks:
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot machine if package or kernel updates require it
      ansible.builtin.reboot:
        msg: "Rebooting machine due to package/kernel updates applied during playbook execution"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 2
        post_reboot_delay: 10
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: Display Services Summary
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " Infrastructure Services VM ({{ inventory_hostname }}) Ready!"
          - "=========================================================="
          - " Admin SSH       : ssh {{ ansible_user }}@{{ ansible_host }}"
          - " Forgejo HTTPS   : https://{{ traefik_forgejo_domain }}"
          - " Forgejo Git SSH : ssh://git@{{ traefik_forgejo_domain }}:{{ forgejo_ssh_port | default(2222) }}"
          - " OpenBao HTTPS   : https://{{ traefik_openbao_domain }}"
          - " Node Exporter   : http://{{ ansible_host }}:{{ node_exporter_port | default(9100) }}/metrics"
          - " Grafana Alloy   : Active (Streaming to {{ alloy_loki_url | default('Loki') }})"
          - " Reverse Proxy   : Traefik v3 (TLS PKI 90-day Auto-Renew, Ports 80/443)"
          - " Service User    : {{ service_user_name }} (Rootless Podman, No Sudo)"
          - " Credentials     : Saved to ansible-services/output/ (Forgejo & OpenBao)"
          - "=========================================================="
