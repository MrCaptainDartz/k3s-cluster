---
- name: Deploy K3s HA Cluster with kube-vip and MetalLB
  hosts: k3s_cluster
  gather_facts: true
  pre_tasks:
    # Force IPv4 preference (blackholed IPv6 delays get_url by 40s)
    - name: Prefer IPv4 in glibc resolver (node IPv6 egress is blackholed)
      ansible.builtin.copy:
        dest: /etc/gai.conf
        content: |
          # Managed by ansible-k3s site.yml. Python urllib (Ansible get_url/uri, k3s downloads)
          # prefers IPv6 by default; this network's IPv6 egress is blackholed, so prefer IPv4.
          precedence ::ffff:0:0/96 100
        mode: "0644"
        owner: root
        group: root
      become: true
    # Auto-detect kube-vip interface based on node_cidr unless explicitly set in all.yml.
    - name: Auto-resolve the kube-vip interface from the VIP subnet
      ansible.builtin.set_fact:
        k3s_vip_interface: "{{ item.device }}"
      loop: >-
        {{
          ansible_facts.interfaces
          | map('extract', ansible_facts)
          | selectattr('ipv4', 'defined')
          | selectattr('ipv4.network', 'defined')
          | list
        }}
      when:
        - k3s_vip_interface | length == 0
          # Compare network prefixes to avoid ipaddr filter (requires netaddr lib)
        - item.ipv4.network == (node_cidr | split('/') | first)

    - name: Fail if the kube-vip interface could not be resolved
      ansible.builtin.fail:
        msg: >-
          Could not find a node interface whose subnet contains the kube-vip
          network (node_cidr={{ node_cidr }}, k3s_vip={{ k3s_vip }}). Set
          k3s_vip_interface explicitly in inventory/group_vars/all.yml.
      when: k3s_vip_interface | length == 0

    # Seed ArgoCD with this repo's root-app (11) only when gitops_root_app_enabled.
    # SOPS Operator (08) and ArgoCD (09) are always installed (baseline). Inline Jinja in the
    # vars list does not work (the YAML parser runs before templating), so build it here.
    - name: Append the root-app manifest (11-root-app) when gitops_root_app_enabled
      ansible.builtin.set_fact:
        k3s_server_manifests_templates: >-
          {{
            k3s_server_manifests_templates
            + (gitops_root_app_enabled | bool | ternary(['11-root-app.yml.j2'], []))
          }}



    # Persistent journald: make K3s logs persistent (/var/log/journal) for Alloy to tail.
    - name: Create journald drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"
      become: true

    - name: Ensure persistent journald config (Alloy tails /var/log/journal)
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/10-persistent.conf
        content: |
          [Journal]
          Storage=persistent
          SystemMaxUse=500M
        mode: "0644"
      become: true
      register: journald_conf

    - name: Restart journald + flush runtime -> persistent
      ansible.builtin.shell: systemctl restart systemd-journald && journalctl --flush
      become: true
      changed_when: false
      when: journald_conf.changed | default(false)

    # kube-apiserver audit logging: deploy policy before k3s restarts.
    # Run playbook with --forks 1 to keep etcd quorum during restarts.
    - name: Ensure audit directories (policy + log) on control planes
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ audit_policy_path | dirname }}"
        - "{{ audit_log_path | dirname }}"
      become: true
      when:
        - audit_enabled | bool
        - k3s_control_node | bool

    - name: Deploy kube-apiserver audit policy on control planes
      ansible.builtin.copy:
        dest: "{{ audit_policy_path }}"
        content: |
          apiVersion: audit.k8s.io/v1
          kind: Policy
          omitStages:
            - RequestReceived
          rules:
            - level: None
              users: ["system:apiserver", "system:kube-scheduler", "system:kube-controller-manager"]
              verbs: ["get", "list", "watch"]
            - level: None
              userGroups: ["system:nodes"]
              verbs: ["get", "list", "watch"]
            - level: None
              userGroups: ["system:nodes"]
              verbs: ["update", "patch"]
              resources:
                - group: ""
                  resources: ["pods", "pods/status", "nodes", "nodes/status"]
            - level: None
              resources:
                - group: "coordination.k8s.io"
                  resources: ["leases"]
            - level: None
              resources:
                - group: "authorization.k8s.io"
                  resources: ["subjectaccessreviews", "tokenreviews"]
                - group: "authentication.k8s.io"
                  resources: ["tokenreviews"]
            - level: None
              resources:
                - group: "events.k8s.io"
                  resources: ["events"]
                - group: ""
                  resources: ["events"]
            - level: Metadata
              resources:
                - group: ""
                  resources: ["secrets"]
              verbs: ["get", "list", "watch"]
            - level: Metadata
              verbs: ["create", "update", "patch", "delete", "deletecollection"]
            - level: Metadata
              resources:
                - group: ""
                  resources: ["pods/exec", "pods/attach", "pods/portforward"]
            - level: None
        mode: "0644"
      become: true
      when:
        - audit_enabled | bool
        - k3s_control_node | bool

  roles:
    - role: xanmanning.k3s

  # Assert CoreDNS replica count (K3s addon no longer sets spec.replicas since v1.25.5).
  post_tasks:
    - name: Wait for CoreDNS Deployment to exist
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - deploy
          - coredns
          - -n
          - kube-system
      changed_when: false
      register: coredns_exists
      retries: 30
      delay: 3
      until: coredns_exists.rc == 0
      when: inventory_hostname == (groups['k3s_cluster'] | first)

    - name: Read current CoreDNS replica count
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - get
          - deploy
          - coredns
          - -n
          - kube-system
          - -o
          - jsonpath={.spec.replicas}
      changed_when: false
      register: coredns_current_replicas
      when: inventory_hostname == (groups['k3s_cluster'] | first)

    - name: Scale CoreDNS to {{ coredns_replicas }}
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - scale
          - deploy
          - coredns
          - -n
          - kube-system
          - --replicas={{ coredns_replicas }}
      when:
        - inventory_hostname == (groups['k3s_cluster'] | first)
        - (coredns_current_replicas.stdout | int) != (coredns_replicas | int)

    - name: Enforce strict PodAntiAffinity for CoreDNS
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/k3s kubectl patch deployment coredns -n kube-system -p '{"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchExpressions":[{"key":"k8s-app","operator":"In","values":["kube-dns"]}]},"topologyKey":"kubernetes.io/hostname"}],"preferredDuringSchedulingIgnoredDuringExecution":null}}}}}}'
      when:
        - inventory_hostname == (groups['k3s_cluster'] | first)
      changed_when: false

        # Post-deploy verification (ensure auto-deploy resources actually rolled out)
        - name: Verify Traefik DaemonSet is rolled out
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - daemonset/traefik
          - -n
          - kube-system
          - --timeout=60s
      changed_when: false
      register: verify_traefik
      retries: 20
      delay: 5
      until: verify_traefik.rc == 0
      when: inventory_hostname == (groups['k3s_cluster'] | first)

    - name: Verify MetalLB controller is rolled out
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - rollout
          - status
          - deployment/controller
          - -n
          - metallb-system
          - --timeout=60s
      changed_when: false
      register: verify_metallb
      retries: 20
      delay: 5
      until: verify_metallb.rc == 0
      when: inventory_hostname == (groups['k3s_cluster'] | first)






        # Kubeconfig for ansible_user
        - name: Check if k3s kubeconfig exists on node
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Create .kube directory for ansible_user
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0750'
      when: k3s_kubeconfig.stat.exists

    - name: Copy k3s kubeconfig to ansible_user profile
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "~{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when: k3s_kubeconfig.stat.exists


