apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-providers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: $(REPO_URL)
    path: gitops/infrastructure/sops-providers
    targetRevision: $(TARGET_REVISION)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: secrets-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
