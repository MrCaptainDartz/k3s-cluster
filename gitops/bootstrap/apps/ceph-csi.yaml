apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ceph-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: default
  source:
    repoURL: $(REPO_URL)
    path: gitops/infrastructure/ceph-csi
    targetRevision: $(TARGET_REVISION)
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: ceph-csi-operator-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
