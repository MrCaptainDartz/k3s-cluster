# Shared Kustomize varReference: declares which CRD fields may contain $(VAR) tokens to substitute.
# Referenced by gitops/bootstrap/apps/kustomization.yaml and the infrastructure kustomizations.
varReference:
  - path: spec/source/repoURL
    kind: Application
  - path: spec/source/targetRevision
    kind: Application
  - path: spec/egress/to/ipBlock/cidr
    kind: NetworkPolicy
  - path: spec/ingress/from/ipBlock/cidr
    kind: NetworkPolicy
