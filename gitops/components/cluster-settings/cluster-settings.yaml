# Cluster-wide (NON-SECRET) values for Kustomize $(VAR) substitution.
# This is the SINGLE place to configure the Git source (repoURL / branch). No secrets here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
data:
  # Git repository ArgoCD syncs (must be reachable with the deploy key configured via Ansible).
  repoURL: git@github.com:MrCaptainDartz/k3s-cluster.git
  targetRevision: main
  cephSubnet: 10.20.3.0/24
  nodesSubnet: 10.20.4.0/24
  servicesSubnet: 10.20.4.0/24
  # K3s pod CIDR (--cluster-cidr), defined in ansible-k3s inventory/group_vars/all.yml (cluster_cidr).
  podsSubnet: 10.42.0.0/16
  domainName: captaindartz.org
  # User LAN(s) — monitoring UIs (Grafana / Prometheus / Alertmanager) are
  # restricted to these via the traefik "local-allowlist" middleware.
  lanSubnetA: 10.20.1.0/24
  lanSubnetB: 10.20.90.0/24
