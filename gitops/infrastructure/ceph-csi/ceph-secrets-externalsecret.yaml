# Materializes Secrets used by storageclasses and ceph-csi-operator.
# Values are retrieved from OpenBao KV v2 via the openbao ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-rbd-secret
  namespace: ceph-csi-operator-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: csi-rbd-secret
  data:
    - secretKey: userID
      remoteRef:
        key: k3s/ceph-csi-operator-system/csi-rbd-secret
        property: userID
    - secretKey: userKey
      remoteRef:
        key: k3s/ceph-csi-operator-system/csi-rbd-secret
        property: userKey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: csi-cephfs-secret
  namespace: ceph-csi-operator-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: csi-cephfs-secret
  data:
    - secretKey: userID
      remoteRef:
        key: k3s/ceph-csi-operator-system/csi-cephfs-secret
        property: userID
    - secretKey: userKey
      remoteRef:
        key: k3s/ceph-csi-operator-system/csi-cephfs-secret
        property: userKey
