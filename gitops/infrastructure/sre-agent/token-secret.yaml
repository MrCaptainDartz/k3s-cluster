# The API server mints the token value, so this manifest is safe to version — only the kubeconfig
# built from it is a secret. ArgoCD recreates it if deleted, with a NEW token.
apiVersion: v1
kind: Secret
metadata:
  name: sre-readonly-token
  namespace: sre-agent
  annotations:
    kubernetes.io/service-account.name: sre-readonly
type: kubernetes.io/service-account-token
