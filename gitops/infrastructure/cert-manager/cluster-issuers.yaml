apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "contact@captaindartz.org"
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
#      - selector:
#          dnsZones:
#            - captaindartz.org
#        dns01:
#          cloudflare:
#            apiTokenSecretRef:
#              name: cloudflare-api-token-main
#              key: token
#      - selector:
#          dnsZones:
#            - other.tld
#        dns01:
#          webhook:
#            groupName: acme.myhomelab.example
#            solverName: ovh
#            config:
#              endpoint: ovh-eu
#              authenticationMethod: application
#              applicationKeyRef:
#                name: ovh-creds-other
#                key: applicationKey
#              applicationSecretRef:
#                name: ovh-creds-other
#                key: applicationSecret
#              applicationConsumerKeyRef:
#                name: ovh-creds-other
#                key: applicationConsumerKey
      - selector:
          dnsZones:
            - captaindartz.org
        dns01:
          webhook:
            groupName: acme.infomaniak.com
            solverName: infomaniak
            config:
              apiTokenSecretRef:
                name: infomaniak-api-token-captaindartz-org
                key: api-token
