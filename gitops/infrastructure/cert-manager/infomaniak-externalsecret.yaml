# Materializes the Secret `infomaniak-api-credentials` for cluster-issuers and
# the Infomaniak webhook from OpenBao KV v2 via the openbao ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infomaniak-api-credentials
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: infomaniak-api-credentials
  data:
    - secretKey: api-token
      remoteRef:
        key: k3s/cert-manager/infomaniak-api-credentials
        property: api-token
