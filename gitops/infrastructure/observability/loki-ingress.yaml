apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: loki-allowlist
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - "$(SERVICES_SUBNET)" # Dedicated infra-services VM subnet
      - "$(NODES_SUBNET)" # K3s cluster nodes subnet
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-loki-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: loki.$(DOMAIN_NAME)
      http:
        paths:
          - path: /loki/api/v1/push
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
  tls:
    - hosts:
        - loki.$(DOMAIN_NAME)
      secretName: loki-tls
