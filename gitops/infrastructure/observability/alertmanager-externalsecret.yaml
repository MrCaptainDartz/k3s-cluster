# Materializes `alertmanager-config` from the alertmanager.yaml template and
# bot-token / chat-id in OpenBao. chat-id MUST be a non-zero integer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # Secret must exist before alertmanager pod mounts it
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
  template:
    engineVersion: v2
    data:
      alertmanager.yaml: |
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: telegram
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token: "{{ .bot_token }}"
                chat_id: {{ .chat_id }}
                send_resolved: true
  data:
    - secretKey: bot_token
      remoteRef:
        key: k3s/monitoring/alertmanager-telegram
        property: bot-token
    - secretKey: chat_id
      remoteRef:
        key: k3s/monitoring/alertmanager-telegram
        property: chat-id
