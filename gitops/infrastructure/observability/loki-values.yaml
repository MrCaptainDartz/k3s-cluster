loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  # Retention (restored from pre-gitops 61-loki.yml.j2). The filesystem object store
  # holds delete requests when retention is on — Loki refuses to start without
  # delete_request_store: filesystem, so it MUST be set alongside retention_enabled.
  compactor:
    working_directory: /var/loki/data/retention
    retention_enabled: true
    delete_request_store: filesystem
    retention_delete_delay: 2h
  limits_config:
    retention_period: 7d
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: proxmox-rbd
read:
  replicas: 0
backend:
  replicas: 0
write:
  replicas: 0
