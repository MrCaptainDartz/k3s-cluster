# kube-prometheus-stack values. Migrated from the ansible template
# 60-kube-prometheus-stack.yml.j2 (commit 0fd1aec, pre-gitops): restores the control-
# plane metrics endpoints (kubeEtcd/kubeControllerManager/kubeScheduler/kubeProxy), the
# Prometheus storage PVC, Grafana persistence + Loki datasource, and moves the
# Alertmanager config (incl. the Telegram receiver bot token) into a SopsSecret so the
# token is encrypted at rest instead of plaintext here.
crds:
  enabled: true
nodeExporter:
  enabled: false   # separate prometheus-node-exporter chart deployed in observability-host

# K3s runs these control-plane components in-process and binds their metrics servers to
# 127.0.0.1 by default. The k3s_server flags in ansible-k3s group_vars (bind-address=
# 0.0.0.0, kube-proxy metrics-bind-address=0.0.0.0, etcd-expose-metrics) expose them by IP
# so Prometheus can scrape the 3 control planes. KPS default ports/schemes match k3s:
# etcd HTTP:2381, kubeControllerManager HTTPS:10257, kubeScheduler HTTPS:10259
# (self-signed -> the KPS default insecureSkipVerify; no secret mounts), kubeProxy
# HTTP:10249. This dev cluster has only the 3 control-plane nodes (no workers), so
# kubeProxy scrapes the same 3 IPs. IPs are hardcoded here because kustomize $(VAR) does
# not reliably substitute into Helm-rendered values (no precedent in this repo).
kubeEtcd:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeControllerManager:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeScheduler:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeProxy:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    # nil selectors => discover all ServiceMonitors/PodMonitors/PrometheusRules across
    # namespaces (the monitors in monitors.yaml + KPS defaults + the node-exporter chart).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox-rbd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# Alertmanager: the config (global + route + receivers incl. the Telegram receiver with
# its bot token) lives in SopsSecret alertmanager-config.sops.yaml, materialized as Secret
# `alertmanager-config` (key alertmanager.yaml). useExistingSecret makes the chart mount
# that Secret and ignore alertmanager.config / templateFiles — the bot token is never in
# plaintext helm values.
alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-config

grafana:
  admin:
    existingSecret: grafana-admin-credentials
  persistence:
    enabled: true
    storageClassName: proxmox-rbd
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.$(DOMAIN_NAME)
    tls:
      - hosts:
          - grafana.$(DOMAIN_NAME)
        secretName: grafana-tls
  # Loki datasource (logs) from the loki chart -> http://loki.monitoring.svc:3100.
  # Prometheus remains the default datasource (kept by the chart).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000