# kube-prometheus-stack values.
# Scrapes control-plane metrics, configures PVC storage, Loki datasource,
# and loads Alertmanager / Grafana credentials from ExternalSecrets (OpenBao).
crds:
  enabled: true
nodeExporter:
  enabled: false   # deployed separately in observability-host

# Control-plane metrics endpoints (K3s binds them to 0.0.0.0 via group_vars flags).
kubeEtcd:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeControllerManager:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeScheduler:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3
kubeProxy:
  enabled: true
  endpoints:
    - 10.20.4.1
    - 10.20.4.2
    - 10.20.4.3

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 34GiB
    scrapeInterval: 30s
    # nil selectors => discover all ServiceMonitors/PodMonitors/PrometheusRules across
    # namespaces (the monitors in monitors.yaml + KPS defaults + the node-exporter chart).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: proxmox-rbd
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 40Gi

# Alertmanager config loaded from ExternalSecret `alertmanager-config`
# (mounted via useExistingSecret so credentials stay out of plaintext values).
# Telegram message template is mounted from the plaintext
# `alertmanager-templates` Secret (not sensitive, no OpenBao roundtrip).
alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    configSecret: alertmanager-config
    secrets:
      - alertmanager-templates

grafana:
  admin:
    existingSecret: grafana-admin-credentials
  persistence:
    enabled: true
    storageClassName: proxmox-rbd
    size: 5Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - grafana.$(DOMAIN_NAME)
    tls:
      - hosts:
          - grafana.$(DOMAIN_NAME)
        secretName: grafana-tls
  # Loki datasource (logs) from the loki chart -> http://loki.monitoring.svc:3100.
  # Prometheus remains the default datasource (kept by the chart).
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000