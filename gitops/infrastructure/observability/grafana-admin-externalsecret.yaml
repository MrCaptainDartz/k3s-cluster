# Materializes the Secret `grafana-admin-credentials` used by kube-prometheus-stack
# from OpenBao KV v2 via the openbao ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # Secret must exist before grafana pod mounts it
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials
  data:
    - secretKey: admin-user
      remoteRef:
        key: k3s/monitoring/grafana-admin-credentials
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: k3s/monitoring/grafana-admin-credentials
        property: admin-password
