# Alertmanager configuration holding the Telegram receiver bot token + chat id.
# Encrypted at rest with sops (age). The sops-operator decrypts this SopsSecret
# in-cluster to materialize Secret `alertmanager-config` (key `alertmanager.yaml`),
# which kube-prometheus-stack mounts via alertmanager.alertmanagerSpec.useExistingSecret
# (see kps-values.yaml). This keeps the bot token out of plaintext helm values.
#
# FILL the placeholders via:  sops edit alertmanager-config.sops.yaml
#   bot_token: REPLACE_WITH_TELEGRAM_BOT_TOKEN  -> your Telegram bot token
#   chat_id:   0                                -> your Telegram chat id (integer)
# sops re-encrypts + regenerates the MAC on save.
apiVersion: addons.projectcapsule.dev/v1alpha1
kind: SopsSecret
metadata:
    name: alertmanager-config
    namespace: monitoring
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
spec:
    secrets:
        - name: alertmanager-config
          stringData:
            alertmanager.yaml: ENC[AES256_GCM,data:,iv:z5vO6gnHX++RrhOwbsX2fQPfd6UaqKgjJOS2O06rGt8=,tag:d1r6eEhBf7Uhhl+upEV63A==,type:str]
sops:
    age:
        - enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSBLL1NHQUdSbDVlTXJvR1pR
