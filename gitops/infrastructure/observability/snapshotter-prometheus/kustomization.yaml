apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: prometheus-
resources:
  - ../../../components/volume-snapshotter
patches:
  - target:
      kind: CronJob
      name: snapshotter
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: snapshotter
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: snapshotter
                    env:
                      - name: SNAP_PREFIX
                        value: "prometheus"
                      - name: SNAP_PVC
                        value: "prometheus-kube-prometheus-stack-prometheus-db-prometheus-kube-prometheus-stack-prometheus-0"
                      - name: SNAP_RETENTION
                        value: "7"
