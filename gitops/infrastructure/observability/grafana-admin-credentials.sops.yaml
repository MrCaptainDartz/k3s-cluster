# Grafana admin credentials (user + password). Encrypted at rest with sops (age).
# The sops-operator decrypts this SopsSecret in-cluster to materialize Secret
# `grafana-admin-credentials`, which kube-prometheus-stack reads via
# grafana.admin.existingSecret (see kps-values.yaml). This keeps the admin password
# out of plaintext helm values (replaces the previous `adminPassword: "admin"`).
#
# FILL the placeholder via:  sops edit grafana-admin-credentials.sops.yaml
#   admin-password: REPLACE_WITH_GRAFANA_ADMIN_PASSWORD  -> your password
# sops re-encrypts + regenerates the MAC on save.
apiVersion: addons.projectcapsule.dev/v1alpha1
kind: SopsSecret
metadata:
    name: grafana-admin-credentials
    namespace: monitoring
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
spec:
    secrets:
        - name: grafana-admin-credentials
          stringData:
