apiVersion: kustomize.config.k8s.io/v1beta1
components:
  - ../../components/cluster-settings
kind: Kustomization
namespace: monitoring

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 87.19.2
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: true
    valuesFile: kps-values.yaml
  - name: loki
    repo: https://grafana-community.github.io/helm-charts
    version: 18.5.4
    releaseName: loki
    namespace: monitoring
    valuesFile: loki-values.yaml
  - name: alloy
    repo: https://grafana.github.io/helm-charts
    version: 1.11.0
    releaseName: alloy
    namespace: observability-host
    valuesFile: alloy-values.yaml
  - name: prometheus-node-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 4.56.1
    releaseName: node-exporter
    namespace: observability-host
    valuesFile: node-exporter-values.yaml

resources:
  - alertmanager-config.sops.yaml
  - grafana-admin-credentials.sops.yaml
  - monitors.yaml
  - network-policies.yaml
  - rules.yaml
  - snapshotter-prometheus
  - snapshotter-grafana
  - snapshotter-loki
