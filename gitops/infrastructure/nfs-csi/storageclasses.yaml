apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: "nfs-media"
provisioner: nfs.csi.k8s.io
parameters:
  server: "nas.example.com"
  share: "/export/media"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - "nfsvers=4.1"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: "nfs-backup"
provisioner: nfs.csi.k8s.io
parameters:
  server: "nas2.example.com"
  share: "/export/backup"
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - "nfsvers=4.1"
  - "ro"
