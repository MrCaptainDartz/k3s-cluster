provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/m0nsterrr/external-dns-webhook-infomaniak
      tag: v0.1.3
    env:
      - name: INFOMANIAK_TOKEN
        valueFrom:
          secretKeyRef:
            name: infomaniak-api-token-captaindartz-org
            key: api-token
domainFilters:
  - captaindartz.org
policy: sync
txtOwnerId: external-dns-infomaniak
sources:
  - ingress
  - service
registry: txt
logLevel: info
