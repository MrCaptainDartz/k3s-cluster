# Materializes the Secret `infomaniak-api-token-cluster-domain` used by external-dns
# from OpenBao KV v2 via the openbao ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infomaniak-api-token-cluster-domain
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: infomaniak-api-token-cluster-domain
  data:
    - secretKey: api-token
      remoteRef:
        key: k3s/external-dns/infomaniak-api-token-cluster-domain
        property: api-token
