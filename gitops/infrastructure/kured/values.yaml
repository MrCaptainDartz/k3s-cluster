configuration:
  period: "5m"
  startTime: "04:00"
  endTime: "05:30"
  timeZone: "UTC"
  lockReleaseDelay: "5m"
rbac:
  create: true
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
