# ClusterSecretStore for OpenBao (infra-services VM).
# Authenticates via short-lived ServiceAccount JWT (auth/kubernetes).
# CA certificate is provided in plain ASCII/PEM via the openbao-ca ConfigMap.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://openbao.infra-services.local:443"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: openbao-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-k3s"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
            audiences:
              - "https://kubernetes.default.svc.cluster.local"
